name: mountain-os
description: A Fedora-powered Linux distro featuring a premium Mac-inspired aesthetic with a native Windows layout toggle.
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # The Files module physically copies your scripts securely into the OS folders
  - type: files
    files:
      - source: scripts/setup-layouts.sh
        destination: /usr/local/bin/setup-layouts.sh

  - type: rpm-ostree
    install:
      - firefox
      - okular
      - kate
      - spectacle
      - fastfetch
      - zenity

  # The Script module executes your setup script during the image build process
  - type: script
    scripts:
      - setup-layouts.sh
